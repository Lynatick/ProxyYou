name: Validate ProxyYou
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dependencies and generated sources
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Generate isolated localhost certificates
        run: bash scripts/generate-test-certificates.sh
      - name: Static analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test --concurrency=1
      - name: Video playback proof tests
        run: node --test test/playback/proof.test.cjs
