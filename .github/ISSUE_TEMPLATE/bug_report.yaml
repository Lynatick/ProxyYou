name: Ошибка приложения
description: Сообщить об ошибке ProxyYou
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options: [macOS, Android, Android TV, Windows x64]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ProxyYou и операционной системы
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести ошибку
      description: Опишите ожидаемый результат и фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журнал или снимок экрана
      description: Удалите адреса подписок, UUID серверов, пароли и другие личные данные.
